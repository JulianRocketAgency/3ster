<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
</style>
</head>
<body>
<script src="https://3ster.vercel.app/3ster-reserveer-plugin.js"></script>
<div id="ds-widget-frame"></div>
<script>
window.addEventListener('load', function() {
  if (typeof DrieStarReserveer !== 'undefined') {
    DrieStarReserveer.inline('ds-widget-frame');
  }

  // Stuur hoogte naar parent zodat iframe mee schaalt
  function sendHeight() {
    var h = document.body.scrollHeight;
    window.parent.postMessage({ type: 'ds-height', height: h }, '*');
  }
  sendHeight();
  var observer = new MutationObserver(sendHeight);
  observer.observe(document.body, { childList: true, subtree: true, attributes: true });
});
</script>
</body>
</html>
